<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Full Census</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#fff;color:#141414;
       font-family:'Space Grotesk',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  p{font-size:1rem;color:#6f6f6f;text-align:center;padding:0 24px;max-width:36ch;line-height:1.5}
  p b{color:#141414}
</style>
</head>
<body>
<p id="m">One moment&hellip;</p>
<!--
  Full Census tracked links, first form:  fullcensus.org/v/?<code>
  New links use fullcensus.org/<code>, served by /404.html. This page keeps
  links already sent working, and marks devices:

    fullcensus.org/v/?me      mark this device as yours; your opens never notify
    fullcensus.org/v/?notme   undo that

  How the tracking works, and why it runs in JavaScript: /v/track.js
-->
<script src="/v/track.js?v=20260917"></script>
<script>
(function () {
  var msg = document.getElementById("m");
  var q = (location.search || "").replace(/^\?/, "").split(/[&=#]/)[0].toLowerCase();
  if (!window.fcLink) { location.replace("https://fullcensus.org/websites/"); return; }

  if (q === "me") {
    fcLink.markMine(true);
    msg.innerHTML = "<b>This device is marked as yours.</b><br>Links you open here are still recorded, but they will never notify you.";
    return;
  }
  if (q === "notme") {
    fcLink.markMine(false);
    msg.innerHTML = "<b>Unmarked.</b><br>Links opened on this device will notify you again.";
    return;
  }
  fcLink.open(q);
})();
</script>
</body>
</html>
