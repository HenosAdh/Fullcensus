<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="A WellCared">
  <!-- A WellCared mark: gabled facade as one closed figure, heart cut into the tympanum.
       Palette locked to the identity standards: burgundy #6E1F31, antique gold #A8894F.
       Every opening is a cut, never a stroke. -->
  <circle cx="50" cy="50" r="49" fill="#6E1F31"/>
  <circle cx="50" cy="50" r="45" fill="none" stroke="#A8894F" stroke-width="0.9"/>
  <circle cx="50" cy="50" r="41.5" fill="none" stroke="#A8894F" stroke-width="2"/>

  <g fill="#A8894F">
    <!-- roof: ridge at 25, eaves at 53, oversailing the wall by 7 each side -->
    <polygon points="50,24.5 79,53 21,53"/>
    <!-- wall -->
    <rect x="28" y="53" width="44" height="21"/>
    <!-- stepped plinth so the house stands rather than floats -->
    <rect x="25" y="74" width="50" height="2.8"/>
    <rect x="22" y="76.8" width="56" height="2.4"/>
  </g>

  <g fill="#6E1F31">
    <!-- heart cut into the tympanum -->
    <path transform="translate(39.72,28.0) scale(0.857)"
          d="M12 21s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.4-7 10-7 10z"/>
    <!-- arched door and two windows on a single head line at 57.5 -->
    <path d="M45.4 74 V62.1 a4.6 4.6 0 0 1 9.2 0 V74 Z"/>
    <rect x="33.2" y="57.5" width="7.2" height="9"/>
    <rect x="59.6" y="57.5" width="7.2" height="9"/>
  </g>
</svg>
